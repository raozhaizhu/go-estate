services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-estate-api
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_SOURCE=root:123456@tcp(mysql:3306)/go_estate?parseTime=true
      - DB_URL=mysql://root:123456@tcp(mysql:3306)/go_estate?parseTime=true
      - REDIS_ADDRESS=redis:6379
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    # 设置字符集utf8mb4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: go_estate
    # 生产环境删除
    ports:
      - "3306:3306"
    volumes:
      - data-volume:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  migration:
    image: migrate/migrate:latest
    container_name: go-estate-migration
    networks:
      - app-network
    volumes:
      - ./internal/dao/migration:/migrations
    command:
      - -path=/migrations
      - -database=mysql://root:123456@tcp(mysql:3306)/go_estate?parseTime=true
      - up
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:8.8.0-alpine
    container_name: redis
    restart: always
    # 生产环境删除
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --appendonly yes
      --requirepass 123456
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - app-network

  nginx:
    image: nginx:1.31.3-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=/prometheus/"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always
    networks:
      - app-network

  grafana:
    image: grafana/grafana:12.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    networks:
      - app-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=etc/loki/local-config.yaml
    networks:
      - app-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail.yml/:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  data-volume:
  redis-data:
